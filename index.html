<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WISDE — 50 Wins Challenge</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Inter, Arial, sans-serif;
      background:
        radial-gradient(circle at top, #202638 0%, #0b0d12 45%, #07080b 100%);
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 30px 16px;
    }

    .container {
      width: 100%;
      max-width: 950px;
    }

    .header {
      text-align: center;
      margin-bottom: 25px;
    }

    .eyebrow {
      color: #9aa4b2;
      font-size: 13px;
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    h1 {
      font-size: clamp(30px, 6vw, 52px);
      font-weight: 800;
      letter-spacing: -2px;
    }

    .subtitle {
      color: #aeb6c2;
      margin-top: 8px;
      font-size: 15px;
    }

    .main-card {
      background: rgba(20, 23, 31, 0.92);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 24px;
      padding: 35px;
      box-shadow: 0 25px 80px rgba(0,0,0,0.4);
      margin-bottom: 18px;
    }

    .progress-section {
      text-align: center;
    }

    .progress-number {
      font-size: clamp(58px, 12vw, 100px);
      font-weight: 900;
      line-height: 1;
    }

    .progress-number span {
      color: #737b88;
      font-size: 0.45em;
    }

    .progress-bar {
      width: 100%;
      height: 18px;
      background: #292e38;
      border-radius: 999px;
      overflow: hidden;
      margin: 25px 0 12px;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      border-radius: inherit;
      background: linear-gradient(90deg, #36d399, #62f5b0);
      transition: width 1s ease;
    }

    .progress-percent {
      color: #8f99a7;
      font-size: 14px;
    }

    .remaining {
      margin-top: 20px;
      font-size: 17px;
      color: #d8dde5;
    }

    .remaining strong {
      color: white;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      margin-top: 25px;
    }

    .stat {
      background: #181c24;
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 16px;
      padding: 20px 12px;
      text-align: center;
    }

    .stat-value {
      font-size: 27px;
      font-weight: 800;
    }

    .stat-label {
      color: #8d96a4;
      font-size: 12px;
      margin-top: 6px;
      text-transform: uppercase;
      letter-spacing: 0.7px;
    }

    .details {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-top: 12px;
    }

    .detail {
      background: #181c24;
      border-radius: 16px;
      padding: 18px;
      text-align: center;
      border: 1px solid rgba(255,255,255,0.06);
    }

    .detail-value {
      font-size: 23px;
      font-weight: 800;
    }

    .detail-label {
      color: #8d96a4;
      font-size: 12px;
      margin-top: 5px;
    }

    .footer {
      text-align: center;
      color: #68717f;
      font-size: 12px;
      margin-top: 18px;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      margin-top: 10px;
      color: #7f8998;
    }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #36d399;
      box-shadow: 0 0 10px #36d399;
    }

    .error {
      text-align: center;
      color: #ff7b7b;
      padding: 30px;
      display: none;
    }

    @media (max-width: 700px) {
      .main-card {
        padding: 24px 18px;
      }

      .stats {
        grid-template-columns: repeat(2, 1fr);
      }

      .details {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="header">
      <div class="eyebrow">FACEIT Challenge</div>
      <h1>50 WINS</h1>
      <div class="subtitle">
        <span id="nickname">WISDE</span> ·
        <span id="month">August 2026</span>
      </div>
    </div>

    <div class="main-card">

      <div class="progress-section">

        <div class="progress-number">
          <span id="wins">—</span>
          <span>/ 50</span>
        </div>

        <div class="progress-bar">
          <div class="progress-fill" id="progress"></div>
        </div>

        <div class="progress-percent">
          <span id="progressText">A carregar...</span>
        </div>

        <div class="remaining">
          <strong id="remaining">—</strong>
          vitórias restantes
        </div>

      </div>

      <div class="stats">

        <div class="stat">
          <div class="stat-value" id="games">—</div>
          <div class="stat-label">Jogos</div>
        </div>

        <div class="stat">
          <div class="stat-value" id="winsStat">—</div>
          <div class="stat-label">Vitórias</div>
        </div>

        <div class="stat">
          <div class="stat-value" id="losses">—</div>
          <div class="stat-label">Derrotas</div>
        </div>

        <div class="stat">
          <div class="stat-value" id="winRate">—</div>
          <div class="stat-label">Win Rate</div>
        </div>

      </div>

      <div class="details">

        <div class="detail">
          <div class="detail-value" id="average">—</div>
          <div class="detail-label">Vitórias / dia</div>
        </div>

        <div class="detail">
          <div class="detail-value" id="required">—</div>
          <div class="detail-label">Necessárias / dia</div>
        </div>

        <div class="detail">
          <div class="detail-value" id="days">—</div>
          <div class="detail-label">Dias restantes</div>
        </div>

      </div>

      <div class="footer">
        <div class="status">
          <span class="dot"></span>
          <span id="updated">A atualizar...</span>
        </div>
      </div>

      <div class="error" id="error">
        Não foi possível obter os dados da FACEIT.
      </div>

    </div>

  </div>

  <script>

    async function loadStats() {

      try {

        const response = await fetch("/api/stats");

        if (!response.ok) {
          throw new Error("API error");
        }

        const data = await response.json();

        document.getElementById("nickname").textContent =
          data.nickname.toUpperCase();

        document.getElementById("month").textContent =
          `${data.month} ${data.year}`;

        document.getElementById("wins").textContent =
          data.wins;

        document.getElementById("winsStat").textContent =
          data.wins;

        document.getElementById("games").textContent =
          data.games;

        document.getElementById("losses").textContent =
          data.losses;

        document.getElementById("winRate").textContent =
          `${data.winRate}%`;

        document.getElementById("remaining").textContent =
          data.winsRemaining;

        document.getElementById("average").textContent =
          data.averagePerDay;

        document.getElementById("required").textContent =
          data.requiredPerDay;

        document.getElementById("days").textContent =
          data.daysRemaining;

        document.getElementById("progress").style.width =
          `${data.progress}%`;

        document.getElementById("progressText").textContent =
          `${data.progress}% concluído`;

        const updated = new Date(data.updatedAt);

        document.getElementById("updated").textContent =
          `Atualizado às ${updated.toLocaleTimeString("pt-PT", {
            hour: "2-digit",
            minute: "2-digit"
          })}`;

        document.getElementById("error").style.display = "none";

      } catch (error) {

        console.error(error);

        document.getElementById("error").style.display = "block";

      }

    }

    loadStats();

    // Atualiza automaticamente a cada 5 minutos
    setInterval(loadStats, 5 * 60 * 1000);

  </script>

</body>
</html>
