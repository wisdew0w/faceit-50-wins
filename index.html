<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Desafio — 50 Vitórias FACEIT</title>
<style>
:root{--bg:#090b10;--card:#11151d;--muted:#8e98a8;--text:#f4f6f8;--accent:#ffb000;--green:#36d17c;--red:#ff5d6c;--line:#242b36}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#0b0e14,#080a0e);color:var(--text);font:15px system-ui,-apple-system,Segoe UI,sans-serif}
.wrap{max-width:1050px;margin:auto;padding:28px 18px 60px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:26px}.tag{color:var(--muted);font-size:13px}.title{font-size:clamp(28px,5vw,48px);font-weight:800;line-height:1.05;margin:5px 0}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px}.hero{grid-column:span 4;padding:24px}.big{font-size:38px;font-weight:800}.muted{color:var(--muted)}.accent{color:var(--accent)}.green{color:var(--green)}.red{color:var(--red)}
.bar{height:12px;background:#222936;border-radius:20px;overflow:hidden;margin:18px 0 8px}.fill{height:100%;background:linear-gradient(90deg,#ff9f00,#ffd15a);width:0%;transition:.3s}
button{border:0;border-radius:12px;padding:13px 17px;font-weight:800;cursor:pointer}.win{background:var(--green);color:#06150c}.loss{background:#252c38;color:#fff}.danger{background:#3a2025;color:#ffb8bf}
.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:14px}.mini{font-size:12px;color:var(--muted)}
.chart{height:230px;display:flex;align-items:flex-end;gap:5px;padding-top:20px}.col{flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:100%}.barcol{background:var(--accent);border-radius:5px 5px 1px 1px;min-height:2px}.day{text-align:center;font-size:10px;color:var(--muted);margin-top:5px}
.log{display:grid;grid-template-columns:80px 1fr 80px;gap:10px;border-bottom:1px solid var(--line);padding:11px 0}.right{text-align:right}
@media(max-width:700px){.grid{grid-template-columns:1fr 1fr}.hero{grid-column:span 2}.big{font-size:30px}.log{grid-template-columns:60px 1fr 55px}}
</style>
</head>
<body><main class="wrap">
<div class="top"><div><div id="period" class="tag">DESAFIO</div><div class="title">50 vitórias na FACEIT</div></div><div class="tag">Atualização manual</div></div>

<section class="grid">
<div class="card hero">
<div class="muted">Progresso</div><div><span id="wins" class="big">0</span><span class="muted"> / 50 vitórias</span></div>
<div class="bar"><div id="fill" class="fill"></div></div>
<div id="status" class="green">Estás no ritmo certo.</div>
<div class="actions"><button class="win" onclick="add(1)">＋ Vitória</button><button class="loss" onclick="add(0)">＋ Derrota</button><button class="danger" onclick="undo()">Desfazer última</button></div>
<div class="mini">As vitórias e derrotas ficam guardadas neste dispositivo.</div>
</div>

<div class="card"><div class="muted">Faltam</div><div id="left" class="big accent">50</div><div class="mini">vitórias</div></div>
<div class="card"><div class="muted">Média atual</div><div id="avg" class="big">0.0</div><div class="mini">vitórias/dia</div></div>
<div class="card"><div class="muted">Precisas de</div><div id="need" class="big">1.6</div><div id="needLabel" class="mini">por dia</div></div>
<div class="card"><div class="muted">Win rate</div><div id="wr" class="big">—</div><div class="mini">dos jogos registados</div></div>

<div class="card hero"><h2>Vitórias por dia</h2><div id="chart" class="chart"></div></div>
<div class="card hero"><h2>Histórico</h2><div id="log"></div></div>
</section>
</main>
<script>
const KEY='faceit50_current_month_v2', TARGET=50;
let data=JSON.parse(localStorage.getItem(KEY)||'[]');
function save(){localStorage.setItem(KEY,JSON.stringify(data))}
function add(win){data.push({date:new Date().toISOString(),win:!!win});save();render()}
function undo(){if(data.length){data.pop();save();render()}}
function dayMap(){let m={};for(const x of data){let d=x.date.slice(0,10);if(!m[d])m[d]={w:0,l:0};x.win?m[d].w++:m[d].l++}return m}
function render(){
 const wins=data.filter(x=>x.win).length, games=data.length, now=new Date();
 const year=now.getFullYear(), month=now.getMonth(), day=now.getDate();
 // Calcula automaticamente quantos dias tem o mês atual.
 const days=new Date(year, month+1, 0).getDate();
 // O próprio dia de hoje conta: dia 24 -> 24,25,26,27,28,29,30,31 = 8 dias.
 const elapsed=Math.max(1,day);
 const remaining=Math.max(0,days-day+1);
 const avg=wins/elapsed, need=remaining?Math.max(0,(TARGET-wins)/remaining):0;
 document.getElementById('wins').textContent=wins;document.getElementById('left').textContent=Math.max(0,TARGET-wins);
 document.getElementById('avg').textContent=avg.toFixed(1);document.getElementById('need').textContent=need.toFixed(1); document.getElementById('needLabel').textContent=`por dia · ${remaining} ${remaining===1?'dia':'dias'} restantes`;
 document.getElementById('wr').textContent=games?(wins/games*100).toFixed(0)+'%':'—';
 document.getElementById('fill').style.width=Math.min(100,wins/TARGET*100)+'%';
 document.getElementById('status').textContent=wins>=TARGET?'🏆 DESAFIO CONCLUÍDO!':avg>=TARGET/days?'Estás acima do ritmo necessário.':'Estás abaixo do ritmo necessário.';
 const monthNames=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
 document.getElementById('period').textContent=`DESAFIO · ${monthNames[month].toUpperCase()} ${year}`;
 const m=dayMap(), chart=document.getElementById('chart');chart.innerHTML='';
 for(let i=1;i<=days;i++){let key=`${year}-${String(month+1).padStart(2,'0')}-${String(i).padStart(2,'0')}`,v=m[key]?.w||0;let c=document.createElement('div');c.className='col';c.innerHTML=`<div class="barcol" style="height:${Math.min(100,v*18)}%"></div><div class="day">${i}</div>`;chart.appendChild(c)}
 const log=document.getElementById('log');log.innerHTML='';
 const groups={};for(const x of data){let d=x.date.slice(0,10);groups[d]??=[];groups[d].push(x)}
 Object.keys(groups).sort().reverse().forEach(d=>{let a=groups[d],w=a.filter(x=>x.win).length,l=a.length-w;log.innerHTML+=`<div class="log"><b>${d.slice(8,10)}/08</b><span>${a.length} jogos · ${w}V · ${l}D</span><span class="right">${w?'+'+w:'—'}</span></div>`})
}
render();
</script></body></html>
