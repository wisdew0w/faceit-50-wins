```html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>FACEIT 50 Wins</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #0f1115;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .container {
      width: 100%;
      max-width: 900px;
      padding: 30px 20px;
    }

    .card {
      background: #181b21;
      border-radius: 18px;
      padding: 35px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.35);
    }

    .header {
      text-align: center;
      margin-bottom: 30px;
    }

    .header h1 {
      margin: 0;
      font-size: 42px;
      font-weight: 800;
    }

    .header p {
      margin-top: 8px;
      color: #8e96a3;
      font-size: 16px;
    }

    .progress-container {
      margin: 30px 0;
    }

    .progress-info {
      display: flex;
      justify-content: space-between;
      margin-bottom: 10px;
      font-size: 15px;
      color: #aab1bd;
    }

    .progress-bar {
      width: 100%;
      height: 18px;
      background: #292e36;
      border-radius: 10px;
      overflow: hidden;
    }

    .progress {
      height: 100%;
      width: 0%;
      background: #ff5500;
      border-radius: 10px;
      transition: width 0.5s ease;
    }

    .main-stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
      margin-top: 30px;
    }

    .stat {
      background: #20242b;
      border-radius: 14px;
      padding: 22px 15px;
      text-align: center;
    }

    .stat .value {
      font-size: 30px;
      font-weight: 800;
      margin-bottom: 7px;
    }

    .stat .label {
      color: #8e96a3;
      font-size: 14px;
    }

    .secondary-stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 15px;
      margin-top: 15px;
    }

    .secondary-stat {
      background: #20242b;
      border-radius: 14px;
      padding: 20px 10px;
      text-align: center;
    }

    .secondary-stat .value {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .secondary-stat .label {
      color: #8e96a3;
      font-size: 13px;
    }

    .status {
      text-align: center;
      margin-top: 28px;
      color: #8e96a3;
      font-size: 14px;
    }

    .error {
      text-align: center;
      color: #ff5c5c;
      margin-top: 20px;
      display: none;
    }

    @media (max-width: 700px) {
      .card {
        padding: 25px 18px;
      }

      .header h1 {
        font-size: 32px;
      }

      .main-stats {
        grid-template-columns: 1fr;
      }

      .secondary-stats {
        grid-template-columns: repeat(2, 1fr);
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="card">

      <div class="header">
        <h1>wins</h1>
        <p id="month">Loading...</p>
      </div>

      <div class="progress-container">

        <div class="progress-info">
          <span id="progressText">0 / 50 wins</span>
          <span id="progressPercent">0%</span>
        </div>

        <div class="progress-bar">
          <div class="progress" id="progressBar"></div>
        </div>

      </div>

      <div class="main-stats">

        <div class="stat">
          <div class="value" id="wins">0</div>
          <div class="label">Wins</div>
        </div>

        <div class="stat">
          <div class="value" id="losses">0</div>
          <div class="label">Losses</div>
        </div>

        <div class="stat">
          <div class="value" id="kd">0.00</div>
          <div class="label">K/D</div>
        </div>

      </div>

      <div class="secondary-stats">

        <div class="secondary-stat">
          <div class="value" id="games">0</div>
          <div class="label">Games</div>
        </div>

        <div class="secondary-stat">
          <div class="value" id="winRate">0%</div>
          <div class="label">Win Rate</div>
        </div>

        <div class="secondary-stat">
          <div class="value" id="averagePerDay">0.00</div>
          <div class="label">Wins / Day</div>
        </div>

        <div class="secondary-stat">
          <div class="value" id="requiredPerDay">0.00</div>
          <div class="label">Required / Day</div>
        </div>

      </div>

      <div class="status" id="status">
        Loading FACEIT data...
      </div>

      <div class="error" id="error"></div>

    </div>

  </div>

  <script>

    async function loadStats() {

      try {

        const response = await fetch("/api/stats");

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || "Failed to load stats.");
        }

        document.getElementById("month").textContent =
          `${data.month} ${data.year}`;

        document.getElementById("wins").textContent =
          data.wins;

        document.getElementById("losses").textContent =
          data.losses;

        document.getElementById("games").textContent =
          data.games;

        document.getElementById("kd").textContent =
          Number(data.kd).toFixed(2);

        document.getElementById("winRate").textContent =
          `${Number(data.winRate).toFixed(1)}%`;

        document.getElementById("averagePerDay").textContent =
          Number(data.averagePerDay).toFixed(2);

        document.getElementById("requiredPerDay").textContent =
          Number(data.requiredPerDay).toFixed(2);

        document.getElementById("progressText").textContent =
          `${data.wins} / ${data.goal} wins`;

        document.getElementById("progressPercent").textContent =
          `${Number(data.progress).toFixed(1)}%`;

        document.getElementById("progressBar").style.width =
          `${Math.min(data.progress, 100)}%`;

        document.getElementById("status").textContent =
          `${data.winsRemaining} wins remaining • ${data.daysRemaining} days remaining`;

        document.getElementById("error").style.display = "none";

      } catch (error) {

        console.error(error);

        document.getElementById("status").style.display = "none";

        const errorElement = document.getElementById("error");

        errorElement.textContent =
          error.message || "Error loading FACEIT data.";

        errorElement.style.display = "block";
      }
    }

    loadStats();

    // Refresh automatically every 60 seconds
    setInterval(loadStats, 60000);

  </script>

</body>
</html>
```
